<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capas de destaques</title>
<!--
  Capas dos destaques do Instagram, na identidade da Zoe (sem o nome escrito): fundo lilás dos alertas,
  ícone em ink com a sombra rosa deslocada (a mesma da tag "Cachorro desaparecido").
  Cada capa é uma section.capa de 1080x1920 com id (nome do arquivo) e data-nome (nome do destaque no app).
  O Instagram mostra só o círculo do meio e bem pequeno no perfil, então o ícone é grosso, centrado e sem texto.
  Os ícones cabem numa caixa de 600x600 (mesmo peso visual); a sombra é o mesmo desenho deslocado 16 px.
  Uso: ./render.sh → saida/<id>.png para cada capa + saida/_preview.png (a fileira como aparece no perfil).
-->
<style>
@font-face{font-family:P;src:url(../fonts/Poppins-ExtraBold.ttf);font-weight:800}
:root{--ink:#17131F;--lilac:#B9A7F3;--pink:#EC4899}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000}
.capa{width:1080px;height:1920px;position:relative;overflow:hidden;
  background:radial-gradient(circle 540px at 50% 50%,#C9BAF6 0%,var(--lilac) 100%);
  display:flex;align-items:center;justify-content:center}
.capa svg{width:660px;height:660px;overflow:visible}
.sombra{color:var(--pink)}
.frente{color:var(--ink)}
.claro{fill:#C4B4F5}   /* detalhes vazados no ink (olhos, focinho): o lilás do centro do fundo */
.num{font-family:P;font-weight:800;font-size:250px}
</style>
</head>
<body>

<!-- pata usada dentro dos ícones (a mesma da lupa de Perdidos) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="pata" viewBox="152 146 206 204">
    <path d="M255 232c-38 0-78 44-78 80 0 26 20 36 42 36 14 0 24-8 36-8s22 8 36 8c22 0 42-10 42-36 0-36-40-80-78-80z"/>
    <ellipse cx="183" cy="228" rx="24" ry="31" transform="rotate(-24 183 228)"/>
    <ellipse cx="226" cy="182" rx="24" ry="32" transform="rotate(-8 226 182)"/>
    <ellipse cx="284" cy="182" rx="24" ry="32" transform="rotate(8 284 182)"/>
    <ellipse cx="327" cy="228" rx="24" ry="31" transform="rotate(24 327 228)"/>
  </symbol>
</svg>

<!-- A Zoe: carinha de cachorro com orelhas caídas e as "sobrancelhas" do preto e caramelo -->
<section class="capa" id="zoe" data-nome="A Zoe">
  <svg viewBox="0 0 600 600" aria-hidden="true">
    <defs>
      <g id="zoe-sil" fill="currentColor" transform="translate(300 300) scale(1.15) translate(-300 -300)">
        <ellipse cx="148" cy="290" rx="64" ry="128" transform="rotate(24 148 290)"/>
        <ellipse cx="452" cy="290" rx="64" ry="128" transform="rotate(-24 452 290)"/>
        <ellipse cx="300" cy="305" rx="152" ry="168"/>
      </g>
    </defs>
    <use href="#zoe-sil" class="sombra" transform="translate(16 16)"/>
    <use href="#zoe-sil" class="frente"/>
    <g transform="translate(300 300) scale(1.15) translate(-300 -300)">  <!-- 15% maior: a carinha é mais larga que alta e parecia menor que os outros ícones -->
    <ellipse class="claro" cx="238" cy="236" rx="16" ry="11"/>
    <ellipse class="claro" cx="362" cy="236" rx="16" ry="11"/>
    <circle class="claro" cx="242" cy="290" r="21"/>
    <circle class="claro" cx="358" cy="290" r="21"/>
    <ellipse class="claro" cx="300" cy="398" rx="82" ry="64"/>
    <ellipse cx="300" cy="376" rx="38" ry="27" fill="#17131F"/>
    <path d="M300 400v16m0 0c-10 14-30 16-42 6m42-6c10 14 30 16 42 6" fill="none" stroke="#17131F"
      stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>
</section>

<!-- 6 dias: calendário com o 6 (a série da busca) -->
<section class="capa" id="seis-dias" data-nome="6 dias">
  <svg viewBox="0 0 600 600" aria-hidden="true">
    <defs>
      <g id="cal" fill="currentColor">
        <path fill-rule="evenodd" d="M150 126h300a64 64 0 0 1 64 64v280a64 64 0 0 1-64 64H150a64 64 0 0 1-64-64V190a64 64 0 0 1 64-64z
          M154 250h292a20 20 0 0 1 20 20v196a20 20 0 0 1-20 20H154a20 20 0 0 1-20-20V270a20 20 0 0 1 20-20z"/>
        <rect x="186" y="78" width="48" height="96" rx="24"/>
        <rect x="366" y="78" width="48" height="96" rx="24"/>
        <text class="num" x="300" y="459" text-anchor="middle">6</text>
      </g>
    </defs>
    <use href="#cal" class="sombra" transform="translate(16 16)"/>
    <use href="#cal" class="frente"/>
  </svg>
</section>

<!-- Perdidos: lupa com uma pata dentro (os animais que ainda estão sendo procurados) -->
<section class="capa" id="perdidos" data-nome="Perdidos">
  <svg viewBox="0 0 600 600" aria-hidden="true">
    <defs>
      <g id="lupa">
        <circle cx="255" cy="255" r="185" fill="none" stroke="currentColor" stroke-width="52"/>
        <line x1="392" y1="392" x2="530" y2="530" stroke="currentColor" stroke-width="78" stroke-linecap="round"/>
        <g fill="currentColor">
          <path d="M255 232c-38 0-78 44-78 80 0 26 20 36 42 36 14 0 24-8 36-8s22 8 36 8c22 0 42-10 42-36 0-36-40-80-78-80z"/>
          <ellipse cx="183" cy="228" rx="24" ry="31" transform="rotate(-24 183 228)"/>
          <ellipse cx="226" cy="182" rx="24" ry="32" transform="rotate(-8 226 182)"/>
          <ellipse cx="284" cy="182" rx="24" ry="32" transform="rotate(8 284 182)"/>
          <ellipse cx="327" cy="228" rx="24" ry="31" transform="rotate(24 327 228)"/>
        </g>
      </g>
    </defs>
    <use href="#lupa" class="sombra" transform="translate(16 16)"/>
    <use href="#lupa" class="frente"/>
  </svg>
</section>

<!-- Em casa: casinha com coração (os que foram encontrados) -->
<section class="capa" id="em-casa" data-nome="Em casa">
  <svg viewBox="0 0 600 600" aria-hidden="true">
    <defs>
      <g id="casa">
        <path d="M86 296L300 110l214 186M156 244v256h288V244" fill="none" stroke="currentColor"
          stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
        <path fill="currentColor" d="M300 452c-86-54-104-100-92-132 10-28 46-38 72-20 9 6 16 14 20 22 4-8 11-16 20-22 26-18 62-8 72 20 12 32-6 78-92 132z"/>
      </g>
    </defs>
    <use href="#casa" class="sombra" transform="translate(16 16)"/>
    <use href="#casa" class="frente"/>
  </svg>
</section>

<!-- Dicas: lâmpada com uma pata dentro (o que fazer quando um animal some) -->
<section class="capa" id="dicas" data-nome="Dicas">
  <svg viewBox="0 0 600 600" aria-hidden="true">
    <defs>
      <g id="lampada">
        <path d="M300 92c94 0 168 72 168 164 0 58-28 102-66 134-18 15-28 32-28 54v22H226v-22c0-22-10-39-28-54-38-32-66-76-66-134 0-92 74-164 168-164z"
          fill="none" stroke="currentColor" stroke-width="48" stroke-linejoin="round"/>
        <path d="M236 532h128M262 588h76" fill="none" stroke="currentColor" stroke-width="44" stroke-linecap="round"/>
        <use href="#pata" x="228" y="176" width="144" height="143" fill="currentColor"/>
      </g>
    </defs>
    <use href="#lampada" class="sombra" transform="translate(16 16)"/>
    <use href="#lampada" class="frente"/>
  </svg>
</section>

<!-- Adoção: coração com uma pata dentro -->
<section class="capa" id="adocao" data-nome="Adoção">
  <svg viewBox="0 0 600 600" aria-hidden="true">
    <defs>
      <g id="coracao">
        <path d="M300 516C150 416 86 330 86 238c0-80 58-134 124-134 44 0 76 24 90 58 14-34 46-58 90-58 66 0 124 54 124 134 0 92-64 178-214 278z"
          fill="none" stroke="currentColor" stroke-width="52" stroke-linejoin="round"/>
        <use href="#pata" x="218" y="196" width="164" height="162" fill="currentColor"/>
      </g>
    </defs>
    <use href="#coracao" class="sombra" transform="translate(16 16)"/>
    <use href="#coracao" class="frente"/>
  </svg>
</section>

</body>
</html>
