<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Cachorra encontrada: São José</title>
<!--
  Aviso de cachorra ENCONTRADA sem tutor conhecido (procura a família), no modelo do encontrado-vila-luiza.html:
  tag ink, foto como polaroide no lilás atravessando para o bloco ink, apelo no ink, contato pelo direct da Zoe.
  A diferença é a foto: ela está deitada de lado, então a polaroide é horizontal, centrada e mais larga.
  Sem marca de identificação informada, não tem o anel nem o detalhe ampliado: só a foto, inteira.

  Caso São José (perdidos/sao-jose.jpeg, foto recebida por direct): foto feita pelo foto_sao_jose.py.
  Só o que a mensagem diz: shih tzu, menina, não castrada, encontrada perdida na São José, perto do Mercado Marcolan.
  O mesmo conteúdo sai em dois formatos: Stories/TikTok 1080x1920 (o pedido) e feed 1080x1350 (clonado pelo script).
-->
<style>
@font-face{font-family:P;src:url(../fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:P;src:url(../fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(../fonts/Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:C;src:url(../fonts/Caveat.ttf);font-weight:400 700}

:root{--ink:#17131F;--cream:#F6F1E9;--lilac:#B9A7F3;--pink:#EC4899}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:P,sans-serif;-webkit-font-smoothing:antialiased}

/* lilás em cima e ink a partir de --painel; a polaroide atravessa a divisa */
.card{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;
  background:linear-gradient(180deg,transparent 0 var(--painel),var(--ink) var(--painel)),
    radial-gradient(ellipse 70% 40% at 50% 25%,#C9BAF6 0%,var(--lilac) 100%);
  --top:48px;--bottom:70px;--painel:560px;
  --py:172px;--pw:760px;--borda:20px;--pe:84px;               /* polaroide: topo, largura da foto, bordas */
  --px:calc((1080px - var(--pw) - 2 * var(--borda) - 14px) / 2)}  /* centrada, contando a sombra */
.card.story{height:1920px;--top:225px;--bottom:210px;--painel:920px;
  --py:440px;--pw:860px;--borda:22px;--pe:96px}

/* tag de categoria: a mesma caixa ink com sombra rosa do alerta */
.tag{position:absolute;top:var(--top);left:50%;transform:translateX(calc(-50% - 5px));z-index:5;
  background:var(--ink);color:#fff;font-weight:800;font-size:46px;line-height:1.08;letter-spacing:.06em;
  text-transform:uppercase;padding:16px 26px 15px;box-shadow:10px 10px 0 var(--pink);white-space:nowrap}
.story .tag{font-size:52px}

/* polaroide horizontal: borda creme, pé mais largo com a pergunta à mão, sombra rosa deslocada */
.polaroide{position:absolute;left:var(--px);top:var(--py);z-index:2;background:var(--cream);
  padding:var(--borda) var(--borda) 0;box-shadow:14px 14px 0 var(--pink);transform:rotate(-2.5deg)}
.polaroide img{display:block;width:var(--pw);aspect-ratio:955/562}
.polaroide .pe{height:var(--pe);display:flex;align-items:center;justify-content:center;
  font-family:C;font-weight:700;font-size:56px;color:var(--ink);padding-bottom:4px}
.story .polaroide .pe{font-size:70px}

.txt{position:absolute;left:72px;right:72px;bottom:var(--bottom);z-index:3}
.h{font-weight:800;font-size:78px;line-height:1.02;letter-spacing:-.025em}
.h em{font-style:normal;color:var(--lilac)}
.story .h{font-size:88px}
.info{margin-top:26px;font-weight:600;font-size:34px;line-height:1.25;color:var(--cream);text-wrap:pretty}
.story .info{font-size:38px;margin-top:30px}
.card:not(.story) .info br{display:none}  /* no feed cabe em duas linhas corridas */
.rot{margin-top:36px;font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,241,233,.7)}
.story .rot{margin-top:48px}
/* contato: direct da Zoe, com o ícone do Instagram */
.tel{margin-top:18px;display:inline-flex;align-items:center;gap:18px;background:var(--pink);
  padding:14px 30px 14px 24px;font-weight:800;font-size:62px;line-height:1.1;letter-spacing:-.01em}
.tel svg{width:1em;height:1em;flex:none;margin-top:-.04em}
.story .tel{font-size:68px}
</style>
</head>
<body>

<section class="card story" id="story">
  <div class="tag">Cachorra encontrada</div>
  <div class="polaroide">
    <img src="img/sao-jose.jpg" alt="">
    <div class="pe">você me conhece?</div>
  </div>
  <div class="txt">
    <div class="h">Ajude essa menina<br><em>a voltar pra casa.</em></div>
    <div class="info">Shih tzu, fêmea, não castrada.<br> Estava na São José, perto do Mercado Marcolan.</div>
    <div class="rot">É sua ou sabe de quem é? Chame no direct</div>
    <div class="tel">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5.5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.3" cy="6.7" r="1.3" fill="#fff" stroke="none"/>
      </svg>
      <span>@souazoe.pf</span>
    </div>
  </div>
</section>

<script>
  // o render.sh espera o feed em cima e o Stories embaixo: clona o Stories como feed e põe antes
  const story = document.getElementById('story');
  const feed = story.cloneNode(true);
  feed.id = 'feed';
  feed.classList.remove('story');
  document.body.prepend(feed);
</script>
</body>
</html>
