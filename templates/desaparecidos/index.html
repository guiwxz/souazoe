<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Alerta de desaparecidos</title>
<!--
  Template de alerta de animal desaparecido, na identidade da Zoe (sem o nome escrito):
  paleta ink/lilás/rosa, Poppins ExtraBold, caixas retas como as legendas dos Reels e o nome à mão (Caveat).
  O mesmo conteúdo sai em dois formatos: feed 1080x1350 (#feed) e Stories/TikTok 1080x1920 (clonado pelo script).
  Para um caso novo: trocar a foto, os nomes e os textos abaixo e rodar ./render.sh <nome>.

  Os cães são o foco: o degradê ink fica só atrás do bloco de texto (sobe --fade px acima dele).
  Foto: .recorte é um PNG recortado sobre o fundo lilás, posicionado pelas coordenadas da arte original
  (--s escala, --x/--y onde cai o canto da faixa recortada). Com uma foto comum, usar <img class="cheia">.
  Os nomes também usam as coordenadas da arte (--ax/--ay), então acompanham a foto.
-->
<style>
@font-face{font-family:P;src:url(../fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:P;src:url(../fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:P;src:url(../fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(../fonts/Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:C;src:url(../fonts/Caveat.ttf);font-weight:400 700}

:root{--ink:#17131F;--cream:#F6F1E9;--lilac:#B9A7F3;--pink:#EC4899}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:P,sans-serif;-webkit-font-smoothing:antialiased}

.card{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(ellipse 70% 45% at 50% 38%,#C9BAF6 0%,var(--lilac) 100%);
  /* foto: escala e posição da faixa recortada (a faixa começa em y=440 na arte original) */
  --s:1.42;--x:-326px;--y:132px;--top:56px;--bottom:70px;--fade:130px}
.card.story{height:1920px;--y:357px;--top:130px;--bottom:300px}

.recorte{position:absolute;left:var(--x);top:var(--y);width:calc(1145px * var(--s))}
.cheia{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* tag em destaque: caixa ink com a sombra rosa deslocada (como o "TCHAU, CARTAZ" do Reel 02) */
.tag{position:absolute;top:var(--top);left:72px;z-index:3;background:var(--ink);color:#fff;
  font-weight:800;font-size:46px;line-height:1;letter-spacing:.06em;text-transform:uppercase;padding:16px 26px 15px;
  box-shadow:10px 10px 0 var(--pink);white-space:nowrap}
.story .tag{font-size:52px;left:50%;transform:translateX(calc(-50% - 5px))}  /* centrada, contando a sombra */

/* nome à mão sobre o cachorro, preso a um ponto da arte; contorno ink como o texto à mão do Reel 02 */
.nome{position:absolute;z-index:4;font-family:C;font-weight:700;font-size:78px;line-height:1;
  left:calc(var(--x) + var(--ax) * var(--s) * 1px);top:calc(var(--y) + (var(--ay) - 440) * var(--s) * 1px);
  transform:rotate(-4deg);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;
  text-shadow:0 3px 0 rgba(23,19,31,.5)}

.txt{position:absolute;left:72px;right:72px;bottom:var(--bottom);z-index:3}
/* degradê ink só atrás do texto, até o pé do card */
.txt::before{content:"";position:absolute;z-index:-1;left:-72px;right:-72px;
  top:calc(-1 * var(--fade));bottom:calc(-1 * var(--bottom));
  background:linear-gradient(180deg,rgba(23,19,31,0),rgba(23,19,31,.6) calc(var(--fade) * .45),
    rgba(23,19,31,.92) calc(var(--fade) * .8),var(--ink) var(--fade))}
.h{font-weight:800;font-size:78px;line-height:1.02;letter-spacing:-.025em}
.h em{font-style:normal;color:var(--lilac)}
.story .h{font-size:88px}
.rot{margin-top:40px;font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,241,233,.7)}
.story .rot{margin-top:56px}
.tel{margin-top:18px;display:inline-flex;align-items:center;gap:20px;background:var(--pink);
  padding:12px 30px 14px 24px;font-weight:800;font-size:84px;line-height:1.05;letter-spacing:-.02em}
.tel svg{width:68px;height:68px;flex:none}
</style>
</head>
<body>

<section class="card" id="feed">
  <img class="recorte" src="img/garibaldi-masha.png" alt="">
  <div class="tag">Cães desaparecidos</div>
  <div class="nome" style="--ax:280;--ay:865">Garibaldi</div>
  <div class="nome" style="--ax:793;--ay:875">Masha</div>
  <div class="txt">
    <div class="h">Sumiram na região<br>do <em>Bom Conselho.</em></div>
    <div class="rot">Se encontrarem, contato</div>
    <div class="tel">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round">
        <path d="M3.6 20.4l1.2-4.1A8.6 8.6 0 1 1 8 19.3z"/>
        <path d="M9 7.6c.3 0 .5.1.6.4l.8 1.9c.1.3 0 .5-.2.7l-.6.7c.8 1.5 2 2.7 3.5 3.5l.7-.6c.2-.2.5-.3.7-.2l1.9.8c.3.1.4.4.4.6 0 1.3-1 2.1-2.2 2-3.6-.4-6.5-3.3-6.9-6.9-.1-1.2.7-2.2 2-2.2z" fill="#fff" stroke="none"/>
      </svg>
      <span>(54) 99102-2221</span>
    </div>
  </div>
</section>

<script>
  // Stories/TikTok: o mesmo card, com mais respiro em cima e embaixo (áreas da interface)
  const story = document.getElementById('feed').cloneNode(true);
  story.id = 'story';
  story.classList.add('story');
  document.body.append(story);
</script>
</body>
</html>
