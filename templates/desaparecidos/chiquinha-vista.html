<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Alerta de desaparecida: Chiquinha foi vista</title>
<!--
  Segundo Story do caso Chiquinha (o primeiro é o chiquinha.html): onde ela foi vista, de lenço rosa.
  A foto (img/chiquinha-vista.jpg, feita pelo foto_chiquinha.py a partir de perdidos/chiquinha-2.jpeg) é a foto
  inteira abaixo da caixa de texto do Story recebido, na largura toda: o lugar também é pista. Ela fica livre:
  a tag fica acima dela, o nome no portão escuro ao lado, e o degradê do texto só cobre o calçamento do pé.
  Mesma identidade do alerta (tag ink, foto sangrada, bloco ink); o feed serve de 2º card se for para o feed.
-->
<style>
@font-face{font-family:P;src:url(../fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:P;src:url(../fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(../fonts/Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:C;src:url(../fonts/Caveat.ttf);font-weight:400 700}

:root{--ink:#17131F;--cream:#F6F1E9;--lilac:#B9A7F3;--pink:#EC4899}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:P,sans-serif;-webkit-font-smoothing:antialiased}

/* feed: a foto começa no topo; o fundo é ink onde ela acaba, sob o degradê */
.card{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;background:var(--ink);
  --py:0px;--top:48px;--bottom:70px;--fade:130px}
/* Stories: faixa lilás em cima (sob a interface) e a foto a partir de 300 px, como no bola.html */
.card.story{height:1920px;--py:300px;--top:225px;--bottom:210px;--fade:150px;
  background:linear-gradient(180deg,transparent 0 700px,var(--ink) 700px),
    radial-gradient(ellipse 80% 30% at 50% 10%,#C9BAF6 0%,var(--lilac) 100%)}

.foto{position:absolute;left:0;top:var(--py);width:1080px}

/* tag em destaque: caixa ink com a sombra rosa deslocada (como o "TCHAU, CARTAZ" do Reel 02) */
.tag{position:absolute;top:var(--top);left:72px;z-index:3;background:var(--ink);color:#fff;
  font-weight:800;font-size:46px;line-height:1.08;letter-spacing:.06em;text-transform:uppercase;padding:16px 26px 15px;
  box-shadow:10px 10px 0 var(--pink);white-space:nowrap}
.story .tag{font-size:52px;left:50%;transform:translateX(calc(-50% - 5px))}  /* centrada, contando a sombra */

/* nome à mão no portão escuro, à direita dela; contorno ink como o texto à mão do Reel 02 */
.nome{position:absolute;z-index:4;font-family:C;font-weight:700;font-size:116px;line-height:1;
  left:604px;top:calc(var(--py) + 150px);transform:rotate(-6deg);-webkit-text-stroke:10px var(--ink);
  paint-order:stroke fill;text-shadow:0 4px 0 rgba(23,19,31,.5)}
.story .nome{font-size:120px}

.txt{position:absolute;left:72px;right:72px;bottom:var(--bottom);z-index:3}
/* degradê ink só atrás do texto, até o pé do card */
.txt::before{content:"";position:absolute;z-index:-1;left:-72px;right:-72px;
  top:calc(-1 * var(--fade));bottom:calc(-1 * var(--bottom));
  background:linear-gradient(180deg,rgba(23,19,31,0),rgba(23,19,31,.6) calc(var(--fade) * .45),
    rgba(23,19,31,.92) calc(var(--fade) * .8),var(--ink) var(--fade))}
.h{font-weight:800;font-size:78px;line-height:1.02;letter-spacing:-.025em}
.h em{font-style:normal;color:var(--lilac)}
.story .h{font-size:88px}
.info{margin-top:26px;font-weight:600;font-size:34px;line-height:1.25;color:var(--cream);text-wrap:pretty}
.story .info{font-size:38px;margin-top:30px}
.rot{margin-top:36px;font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,241,233,.7)}
.story .rot{margin-top:48px}
/* contato: direct da Zoe, com o ícone do Instagram */
.tel{margin-top:18px;display:inline-flex;align-items:center;gap:18px;background:var(--pink);
  padding:14px 30px 14px 24px;font-weight:800;font-size:62px;line-height:1.1;letter-spacing:-.01em}
.tel svg{width:1em;height:1em;flex:none;margin-top:-.04em}
.story .tel{font-size:68px}
</style>
</head>
<body>

<section class="card" id="feed">
  <img class="foto" src="img/chiquinha-vista.jpg" alt="">
  <div class="tag">Ela foi vista</div>
  <div class="nome">Chiquinha</div>
  <div class="txt">
    <div class="h">De lenço rosa,<br>perto da <em>Retipasso.</em></div>
    <div class="info">Se encontrar, por favor, segure com calma, sem correr atrás: ela está assustada.</div>
    <div class="rot">Viu a Chiquinha? Chame no direct</div>
    <div class="tel">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5.5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.3" cy="6.7" r="1.3" fill="#fff" stroke="none"/>
      </svg>
      <span>@souazoe.pf</span>
    </div>
  </div>
</section>

<script>
  // Stories/TikTok: o mesmo card, com mais respiro em cima e embaixo (áreas da interface)
  const story = document.getElementById('feed').cloneNode(true);
  story.id = 'story';
  story.classList.add('story');
  document.body.append(story);
</script>
</body>
</html>
