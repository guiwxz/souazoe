<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Alerta de desaparecida: Frida</title>
<!--
  Template de alerta de animal desaparecido, na identidade da Zoe (sem o nome escrito):
  paleta ink/lilás/rosa, Poppins ExtraBold, caixas retas como as legendas dos Reels e o nome à mão (Caveat).
  O mesmo conteúdo sai em três formatos: feed 1080x1350 (#feed), Stories/TikTok 1080x1920 e quadrado 1080x1080
  para carrossel (os dois clonados pelo script; o render.sh só exporta o quadrado quando a página tem esse card).

  Caso Frida (perdidos/frida.jpeg, print do post da família num grupo de achados e perdidos do Facebook,
  recebido por direct): no modelo do bidi.html, com a foto original (460 px, img/frida.png do foto_frida.py)
  num cartão com a sombra rosa sobre o lilás. A cabeça dela fica embaixo à esquerda, então o nome à mão vai
  para o canto de baixo à DIREITA, sobre a manta, longe dela.
  Só o que o post e o direct dizem: sumiu na Vila Jardim, atende por Frida, muito dócil, e os dois telefones
  (sem DDD no post, então sem DDD aqui). A cor é o que a foto mostra. O post não fala em WhatsApp: ícone de telefone.
  No quadrado não cabe tudo empilhado: a foto fica no lilás e o texto vira duas colunas no bloco ink
  (título e dados à esquerda, chamada e telefones à direita).
-->
<style>
@font-face{font-family:P;src:url(../fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:P;src:url(../fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(../fonts/Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:C;src:url(../fonts/Caveat.ttf);font-weight:400 700}

:root{--ink:#17131F;--cream:#F6F1E9;--lilac:#B9A7F3;--pink:#EC4899}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:P,sans-serif;-webkit-font-smoothing:antialiased}

.card{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(ellipse 70% 45% at 50% 32%,#C9BAF6 0%,var(--lilac) 100%);
  --top:56px;--bottom:70px;--fade:130px;
  --fw:520px;--fy:160px;--fx:calc((1080px - var(--fw) - 14px) / 2)}  /* cartão da foto, centrado contando a sombra */
/* Stories: tag em top 225, texto a 210 px do pé, foto maior */
.card.story{height:1920px;--top:225px;--bottom:210px;--fade:150px;
  --fw:640px;--fy:350px}
/* quadrado (carrossel): foto um pouco maior que no feed, texto em duas colunas embaixo */
.card.quadrado{height:1080px;--top:48px;--bottom:60px;--fade:110px;
  --fw:530px;--fy:162px}

/* tag em destaque: caixa ink com a sombra rosa deslocada (como o "TCHAU, CARTAZ" do Reel 02) */
.tag{position:absolute;top:var(--top);left:72px;z-index:5;background:var(--ink);color:#fff;
  font-weight:800;font-size:46px;line-height:1;letter-spacing:.06em;text-transform:uppercase;padding:16px 26px 15px;
  box-shadow:10px 10px 0 var(--pink);white-space:nowrap}
.story .tag{font-size:52px;left:50%;transform:translateX(calc(-50% - 5px))}  /* centrada, contando a sombra */

/* foto original inteira: cartão com a sombra rosa deslocada, acima do degradê do texto */
.foto{position:absolute;left:var(--fx);top:var(--fy);width:var(--fw);aspect-ratio:460/470;z-index:4;
  border-radius:24px;box-shadow:14px 14px 0 var(--pink)}

/* nome à mão no canto de baixo à direita da foto (só manta ali); contorno ink como o texto à mão do Reel 02 */
.nome{position:absolute;z-index:6;font-family:C;font-weight:700;font-size:120px;line-height:1;
  right:calc(var(--fx) - 60px);top:calc(var(--fy) + var(--fw) * 470 / 460 - 112px);
  transform:rotate(-6deg);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;
  text-shadow:0 4px 0 rgba(23,19,31,.5)}
.story .nome{font-size:140px;right:calc(var(--fx) - 70px);top:calc(var(--fy) + var(--fw) * 470 / 460 - 130px)}
.quadrado .nome{font-size:110px;top:calc(var(--fy) + var(--fw) * 470 / 460 - 104px)}

.txt{position:absolute;left:72px;right:72px;bottom:var(--bottom);z-index:3}
/* degradê ink só atrás do texto, até o pé do card */
.txt::before{content:"";position:absolute;z-index:-1;left:-72px;right:-72px;
  top:calc(-1 * var(--fade));bottom:calc(-1 * var(--bottom));
  background:linear-gradient(180deg,rgba(23,19,31,0),rgba(23,19,31,.6) calc(var(--fade) * .45),
    rgba(23,19,31,.92) calc(var(--fade) * .8),var(--ink) var(--fade))}
.h{font-weight:800;font-size:78px;line-height:1.02;letter-spacing:-.025em}
.h em{font-style:normal;color:var(--lilac)}
.story .h{font-size:88px}
.info{margin-top:26px;font-weight:600;font-size:34px;line-height:1.3;color:var(--cream)}
.story .info{font-size:38px;margin-top:30px}
.rot{margin-top:36px;font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,241,233,.7)}
.story .rot{margin-top:52px}
/* telefones: os dois números um embaixo do outro na mesma caixa, ícone centrado na altura dos dois */
.tel{margin-top:18px;display:inline-flex;align-items:center;gap:20px;background:var(--pink);
  padding:12px 30px 12px 24px;font-weight:800;font-size:62px;line-height:1.1;letter-spacing:-.01em}
.tel svg{width:.95em;height:.95em;flex:none}
.tel span{display:block}
.story .tel{font-size:68px}
/* quadrado: título e dados à esquerda, chamada e telefones à direita, alinhados pelo pé */
.quadrado .tag{left:50%;transform:translateX(calc(-50% - 5px))}
.quadrado .txt{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.quadrado .h{font-size:70px}
.quadrado .info{font-size:30px;margin-top:18px}
.card:not(.quadrado) .rot br{display:none}  /* a quebra só serve na coluna estreita do quadrado */
.quadrado .rot{margin-top:0;max-width:430px;font-size:24px;line-height:1.35}
.quadrado .tel{font-size:56px}
</style>
</head>
<body>

<section class="card" id="feed">
  <div class="tag">Cachorra desaparecida</div>
  <img class="foto" src="img/frida.png" alt="">
  <div class="nome">Frida</div>
  <div class="txt">
    <div class="esq">
      <div class="h">Sumiu na<br><em>Vila Jardim.</em></div>
      <div class="info">Atende pelo nome de Frida.<br>É caramelo e muito dócil.</div>
    </div>
    <div class="dir">
    <div class="rot">Viu a Frida?<br> Ligue para a família</div>
    <div class="tel">
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </svg>
      <div><span>99154-3878</span><span>98125-8253</span></div>
    </div>
    </div>
  </div>
</section>

<script>
  // Stories/TikTok e quadrado: o mesmo card, nessa ordem embaixo do feed (o render.sh recorta pela posição)
  for (const formato of ['story', 'quadrado']) {
    const card = document.getElementById('feed').cloneNode(true);
    card.id = formato;
    card.classList.add(formato);
    document.body.append(card);
  }
</script>
</body>
</html>
