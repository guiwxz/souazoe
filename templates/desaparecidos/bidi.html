<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Alerta de desaparecido: Bidi</title>
<!--
  Template de alerta de animal desaparecido, na identidade da Zoe (sem o nome escrito):
  paleta ink/lilás/rosa, Poppins ExtraBold, caixas retas como as legendas dos Reels e o nome à mão (Caveat).
  O mesmo conteúdo sai em dois formatos: feed 1080x1350 (#feed) e Stories/TikTok 1080x1920 (clonado pelo script).

  Caso Bidi (perdidos/bidi.jpeg, arte "ATENÇÃO / DESAPARECIDO" de 720x1280): a foto é a original, sem retoque
  (img/bidi.png, só o miolo da moldura azul, tirado pelo foto_bidi.py). Ela tem só 450 px de largura, então em vez
  de sangrar no card (como no Bob e na Bola) entra inteira, num cartão com a sombra rosa sobre o lilás: assim não
  é ampliada demais nem cortada, e é a mesma no feed e no Story. O resto é o alerta de sempre (tag ink, bloco ink).
  Dados da arte: sumiu em frente ao Cais da Vila Luiza, atende pelo nome de Bidi, é idoso, contato da Lisi
  (99607-3423) e o @lesiandra_ferraz. Data e hora vieram do pedido: 08/10, perto do meio-dia.
  O contato é por telefone (a arte não fala em WhatsApp), então o ícone é o de telefone, como no Thor.
-->
<style>
@font-face{font-family:P;src:url(../fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:P;src:url(../fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:P;src:url(../fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:P;src:url(../fonts/Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:C;src:url(../fonts/Caveat.ttf);font-weight:400 700}

:root{--ink:#17131F;--cream:#F6F1E9;--lilac:#B9A7F3;--pink:#EC4899}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:P,sans-serif;-webkit-font-smoothing:antialiased}

.card{width:1080px;height:1350px;position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(ellipse 70% 45% at 50% 32%,#C9BAF6 0%,var(--lilac) 100%);
  --top:56px;--bottom:70px;--fade:130px;
  --fx:280px;--fy:166px;--fw:520px}   /* cartão da foto: posição e largura (a altura segue a proporção 450:504) */
/* Stories: tag em top 225, texto a 210 px do pé, foto maior */
.card.story{height:1920px;--top:225px;--bottom:210px;--fade:150px;
  --fx:200px;--fy:350px;--fw:680px}

/* tag em destaque: caixa ink com a sombra rosa deslocada (como o "TCHAU, CARTAZ" do Reel 02) */
.tag{position:absolute;top:var(--top);left:72px;z-index:5;background:var(--ink);color:#fff;
  font-weight:800;font-size:46px;line-height:1;letter-spacing:.06em;text-transform:uppercase;padding:16px 26px 15px;
  box-shadow:10px 10px 0 var(--pink);white-space:nowrap}
.story .tag{font-size:52px;left:50%;transform:translateX(calc(-50% - 5px))}  /* centrada, contando a sombra */

/* foto original inteira: cartão com a sombra rosa deslocada (os cantos arredondados escondem a sobra da moldura) */
.foto{position:absolute;left:var(--fx);top:var(--fy);width:var(--fw);aspect-ratio:450/504;z-index:4;
  border-radius:24px;box-shadow:14px 14px 0 var(--pink)}

/* nome à mão sobre o canto de baixo da foto; contorno ink como o texto à mão do Reel 02 */
.nome{position:absolute;z-index:6;font-family:C;font-weight:700;font-size:120px;line-height:1;
  left:calc(var(--fx) - 70px);top:calc(var(--fy) + var(--fw) * 504 / 450 - 120px);
  transform:rotate(-6deg);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;
  text-shadow:0 4px 0 rgba(23,19,31,.5)}
.story .nome{font-size:140px;left:calc(var(--fx) - 80px);top:calc(var(--fy) + var(--fw) * 504 / 450 - 140px)}

.txt{position:absolute;left:72px;right:72px;bottom:var(--bottom);z-index:3}
/* degradê ink só atrás do texto, até o pé do card */
.txt::before{content:"";position:absolute;z-index:-1;left:-72px;right:-72px;
  top:calc(-1 * var(--fade));bottom:calc(-1 * var(--bottom));
  background:linear-gradient(180deg,rgba(23,19,31,0),rgba(23,19,31,.6) calc(var(--fade) * .45),
    rgba(23,19,31,.92) calc(var(--fade) * .8),var(--ink) var(--fade))}
.h{font-weight:800;font-size:78px;line-height:1.02;letter-spacing:-.025em}
.h em{font-style:normal;color:var(--lilac)}
.story .h{font-size:88px}
.info{margin-top:26px;font-weight:600;font-size:34px;line-height:1.3;color:var(--cream)}
.story .info{font-size:38px;margin-top:30px}
.rot{margin-top:36px;font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,241,233,.7)}
.rot span{text-transform:none;letter-spacing:.04em}  /* o @ fica como se escreve */
.story .rot{margin-top:52px}
/* telefone: um degrau abaixo do título (não compete com ele), ícone na altura do número */
.tel{margin-top:18px;display:inline-flex;align-items:center;gap:18px;background:var(--pink);
  padding:14px 30px 14px 24px;font-weight:800;font-size:62px;line-height:1.1;letter-spacing:-.01em}
.tel svg{width:.95em;height:.95em;flex:none;margin-top:-.04em}
.story .tel{font-size:68px}
</style>
</head>
<body>

<section class="card" id="feed">
  <div class="tag">Cachorro desaparecido</div>
  <img class="foto" src="img/bidi.png" alt="">
  <div class="nome">Bidi</div>
  <div class="txt">
    <div class="h">Sumiu em frente ao<br><em>Cais da Vila Luiza.</em></div>
    <div class="info">Passo Fundo/RS, 08/10, perto do meio-dia.<br>Atende pelo nome de Bidi e é idoso.</div>
    <div class="rot">Contato: Lisi · <span>@lesiandra_ferraz</span></div>
    <div class="tel">
      <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </svg>
      <span>(54) 99607-3423</span>
    </div>
  </div>
</section>

<script>
  // Stories/TikTok: o mesmo card, com mais respiro em cima e embaixo (áreas da interface)
  const story = document.getElementById('feed').cloneNode(true);
  story.id = 'story';
  story.classList.add('story');
  document.body.append(story);
</script>
</body>
</html>
